<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amostra licenciada em iframe NOCTA</title>
<style>html,body{margin:0;background:#070b14;color:#dce7f5;font:13px system-ui}video{width:100%;max-height:75vh;display:block;background:#000}p{padding:0 14px;line-height:1.6}a{color:#8ad9f3}</style></head><body>
<button id="play" type="button" style="margin:10px;padding:9px 14px;background:#8ad9f3;border:0;border-radius:5px">Reproduzir amostra autorizada</button>
<video controls playsinline preload="metadata" aria-label="Big Buck Bunny — amostra autorizada" src="https://storage.googleapis.com/cpe-sample-media/content/big_buck_bunny/prog/big_buck_bunny_prog.mp4"></video>
<p>Big Buck Bunny · © 2008 Blender Foundation / www.bigbuckbunny.org. Direção: Sacha Goedegebure. Filme integral, sem alterações.<br><a href="https://creativecommons.org/licenses/by/3.0/">CC BY 3.0</a> · <a href="https://peach.blender.org/about/">Projeto e créditos</a> · Amostra pública Google Cast.</p>
<script>
  const params = new URLSearchParams(location.search)
  const challenge = params.get('challenge')
  const target = params.get('parentOrigin')
  const video = document.querySelector('video')
  function send(event) {
    if (!challenge || !target) return
    try { if (!['http:', 'https:'].includes(new URL(target).protocol)) return } catch { return }
    parent.postMessage({ protocol: 'nocta-fixture-v1', challenge, event }, target)
  }
  video.addEventListener('playing', () => send('playing'))
  document.querySelector('#play').addEventListener('click', () => video.play().catch(() => send('media-error')))
  video.addEventListener('error', () => send('media-error'))
  send('ready')
</script></body></html>
